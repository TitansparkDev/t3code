# Not run on this fork.
#
# Every job below wants a runner this machine does not have — Blacksmith's
# hosted fleet, or macOS. Nothing may run on a GitHub-hosted runner here (there
# are no Actions minutes and none are being bought) and there is no Mac, so
# these sat queued forever waiting for a runner that will never appear. A run
# that never starts is indistinguishable from one still going, which is how a
# repo's checks stop meaning anything.
#
# Left on workflow_dispatch so the file stays close to upstream and can be run
# by hand if a suitable runner is ever attached. The landing gate is ci.yml,
# which runs here.
name: Publish AUR package

# See packaging/aur/README.md.

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: publish-aur
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    if: github.repository == 'pingdotgg/t3code'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    container:
      image: archlinux:base-devel

    steps:
      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm --needed git github-cli jq namcap openssh sudo

      - name: Checkout packaging sources
        uses: actions/checkout@v6

      - name: Create unprivileged build user
        run: |
          useradd --create-home builder
          install -Dm0440 /dev/stdin /etc/sudoers.d/builder <<'EOF'
          builder ALL=(root) NOPASSWD: /usr/bin/pacman
          EOF

      - name: Validate and publish package sources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PKGREL: ${{ inputs.pkgrel || '1' }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: packaging/aur/scripts/release.sh
