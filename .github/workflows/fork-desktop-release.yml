name: Fork desktop release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v0.0.45"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  linux-cli-archive:
    name: Build Linux CLI archive for Windows WSL support
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/scripts... --filter=@t3tools/web...

      - name: Build web client and server executable
        shell: bash
        env:
          VP_NODE_VERSION: "26.8.2"
        run: |
          set -euo pipefail
          vp run --filter=@t3tools/web build
          node apps/server/scripts/cli.ts build --verbose
          node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build Linux resource monitor
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --manifest-path native/resource-monitor/Cargo.toml \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
            "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"

      - name: Build and smoke-test Linux CLI archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$version" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli
          node scripts/smoke-cli-archive.ts \
            --archive release-cli/* \
            --expect-version "$version"

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: fork-wsl-runtime
          path: release-cli/*
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure public T3 Connect build settings
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          cp .env.example .env
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const values = {
            T3CODE_CLERK_PUBLISHABLE_KEY: process.env.T3CODE_CLERK_PUBLISHABLE_KEY,
            T3CODE_CLERK_JWT_TEMPLATE: process.env.T3CODE_CLERK_JWT_TEMPLATE,
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: process.env.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID,
            T3CODE_RELAY_URL: process.env.T3CODE_RELAY_URL,
          };
          let envFile = readFileSync(".env", "utf8");
          for (const [key, rawValue] of Object.entries(values)) {
            const value = rawValue?.trim();
            if (!value) continue;
            const line = `${key}=${value}`;
            const pattern = new RegExp(`^${key}=.*$`, "m");
            envFile = pattern.test(envFile)
              ? envFile.replace(pattern, line)
              : `${envFile.trimEnd()}\n${line}\n`;
          }
          writeFileSync(".env", envFile);
          NODE

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build Linux installer and update metadata
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "$version"
          mkdir -p release-publish
          cp release/*.AppImage release/*.yml release-publish/

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-linux
          path: release-publish/*
          if-no-files-found: error

  android:
    name: Android production APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure public T3 Connect build settings
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          cp .env.example .env
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const values = {
            T3CODE_CLERK_PUBLISHABLE_KEY: process.env.T3CODE_CLERK_PUBLISHABLE_KEY,
            T3CODE_CLERK_JWT_TEMPLATE: process.env.T3CODE_CLERK_JWT_TEMPLATE,
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: process.env.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID,
            T3CODE_RELAY_URL: process.env.T3CODE_RELAY_URL,
          };
          let envFile = readFileSync(".env", "utf8");
          for (const [key, rawValue] of Object.entries(values)) {
            const value = rawValue?.trim();
            if (!value) continue;
            const line = `${key}=${value}`;
            const pattern = new RegExp(`^${key}=.*$`, "m");
            envFile = pattern.test(envFile)
              ? envFile.replace(pattern, line)
              : `${envFile.trimEnd()}\n${line}\n`;
          }
          writeFileSync(".env", envFile);
          NODE

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: vp install --filter=@t3tools/mobile...

      - name: Generate production Android project
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          EXPO_NO_GIT_STATUS: "1"
        run: vp exec expo prebuild --platform android

      - name: Build production APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Collect Android release asset
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          mkdir -p release-publish
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-publish/t3code-android-${version}-production.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v7
        with:
          name: fork-android
          path: release-publish/*
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: linux-cli-archive
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure public T3 Connect build settings
        shell: bash
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
        run: |
          set -euo pipefail
          cp .env.example .env
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const values = {
            T3CODE_CLERK_PUBLISHABLE_KEY: process.env.T3CODE_CLERK_PUBLISHABLE_KEY,
            T3CODE_CLERK_JWT_TEMPLATE: process.env.T3CODE_CLERK_JWT_TEMPLATE,
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: process.env.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID,
            T3CODE_RELAY_URL: process.env.T3CODE_RELAY_URL,
          };
          let envFile = readFileSync(".env", "utf8");
          for (const [key, rawValue] of Object.entries(values)) {
            const value = rawValue?.trim();
            if (!value) continue;
            const line = `${key}=${value}`;
            const pattern = new RegExp(`^${key}=.*$`, "m");
            envFile = pattern.test(envFile)
              ? envFile.replace(pattern, line)
              : `${envFile.trimEnd()}\n${line}\n`;
          }
          writeFileSync(".env", envFile);
          NODE

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Linux CLI archive for WSL
        uses: actions/download-artifact@v8
        with:
          name: fork-wsl-runtime
          path: wsl-runtime

      - name: Install dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Build Windows installer and update metadata
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$version" \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz
          mkdir -p release-publish
          cp release/*.exe release/*.blockmap release/*.yml release-publish/

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: fork-desktop-windows
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: fork-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download Android release asset
        uses: actions/download-artifact@v8
        with:
          name: fork-android
          path: release-assets

      - name: Verify complete updater release
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/*.AppImage
          test -s release-assets/*.exe
          test -s release-assets/*.exe.blockmap
          test -s release-assets/latest.yml
          test -s release-assets/latest-linux.yml
          test -s release-assets/t3code-android-*-production.apk

      - name: Publish installers and updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then tag="$GITHUB_REF_NAME"; fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            args=(
              release create "$tag"
              release-assets/*
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --title "T3 Code $tag"
              --notes "Desktop installers for $tag."
            )
            if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
            gh "${args[@]}"
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort
