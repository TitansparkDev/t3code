# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Build and publish production-channel mobile artifacts with EAS.
#
# Runs on every push to main that touches mobile code, assets, or workspace
# dependencies, or manual workflow_dispatch.
#
# Production runs in two modes depending on what changed:
#   1. Native build: triggered when the Expo native fingerprint drifts from the
#      latest successful production build. Builds an iOS .ipa (submitted to
#      TestFlight for internal testing) and Android .aab (uploaded as a GitHub
#      Actions artifact; release to internal testing tracks on Google Play
#      Store stays a manual App Store Connect step.
#   2. OTA: publish a production-channel update for each platform where at
#      least one finished production build matches the current native
#      fingerprint. Old-version binaries with a matching fingerprint receive
#      it too. When native drift means no binary could install the update,
#      it is skipped and flagged in the job summary instead of published
#      into the void.
# workflow_dispatch remains as a manual override for both modes (e.g. to
# retry an errored build or force an OTA).
# Manual v2-preview builds keep the production app identity and disable OTA.
# Select the v2 branch when dispatching a preview build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build (+ auto-submit to TestFlight) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      profile:
        description: "Store build profile (v2-preview supports build mode only)"
        required: true
        type: choice
        default: production
        options:
          - production
          - v2-preview
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      version:
        description: "Optional build version override (blank uses app.config.ts; an override is committed before building)"
        required: false
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

# Serialize runs so OTAs publish in merge order. GitHub keeps at most one
# queued run per group, so a burst of merges collapses into one run of the
# newest commit — intermediate commits don't need their own OTA.
concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS ${{ inputs.profile || 'production' }} ${{ github.event_name == 'push' && 'auto' || inputs.mode }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]') --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS CLI
        run: pnpm --filter @t3tools/mobile exec eas-cli --version

      - name: Run EAS build or update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_PROFILE: ${{ inputs.profile || 'production' }}
          EAS_BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          EAS_BUILD_MODE: ${{ inputs.mode || 'build' }}
          EAS_BUILD_VERSION: ${{ inputs.version || '' }}
          EAS_UPDATE_MESSAGE: ${{ inputs.message || '' }}
        run: |
          node apps/mobile/scripts/eas-production.js
