plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.t3tools.backgroundconnection'
version = '0.0.0'

android {
  namespace 'expo.modules.t3backgroundconnection'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName '0.0.0'
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core:1.17.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}

// Robolectric's Android 16 runtime needs Java 21 even though Expo modules
// themselves compile against the project's Java 17 toolchain.
tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}
